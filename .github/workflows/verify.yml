name: Verify Commits
on:
  merge_group:
  pull_request:
    branches: [main]
permissions:
  contents: read

jobs:
  rust:
    name: Rust
    uses: metio/ci/.github/workflows/rust.yml@04756928cf7540cd8656c72ac1cc2860e483f087 # feat/rust-workflow
  lint:
    name: Lint
    uses: metio/ci/.github/workflows/lint.yml@ae0e705ebcf7129d3f8e15699a6941b6a86e0742 # feat/lint-workflow
  verify:
    name: Verify
    needs: [rust, lint]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify every job succeeded or skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          [ -z "$bad" ] || { echo "::error::$bad"; exit 1; }
